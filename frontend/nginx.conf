server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A single-page app: a path that isn't a file (/applications/42) gets index.html,
    # and React Router shows the right page. Without this, a refresh would be a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every asset's file name, so assets can be cached for
    # a year: a new build has new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be fresh, or the browser would keep loading old assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
