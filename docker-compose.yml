services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: jobtrail
      POSTGRES_DB: jobtrail
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail"]
      interval: 5s
      retries: 5
volumes:
  pgdata:
