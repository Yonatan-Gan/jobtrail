services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: jobtrail
      POSTGRES_DB: jobtrail
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail"]
      interval: 5s
      retries: 5

  migrate:
    build: ./backend
    image: jobtrail-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobtrail:jobtrail@db:5432/jobtrail
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: jobtrail-backend
    environment:
      DATABASE_URL: postgresql+psycopg://jobtrail:jobtrail@db:5432/jobtrail
      # Browser origins allowed to call the API (a JSON list): the nginx frontend
      # below and the Vite dev server. Override with CORS_ORIGINS='["https://…"]'.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}'
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        # Where the browser finds the API. Vite bakes it into the JavaScript, so a
        # different address means a rebuild: VITE_API_URL=https://… docker compose up --build
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: jobtrail-frontend
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
